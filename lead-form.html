<!-- juba-lead-form: заявка с сайта → https://jubatravel.uz/lead.php → группа Juba Bot (#jubamarketing) -->
<style>
#jl-fab{position:fixed;right:20px;bottom:84px;z-index:99998;background:#e8a20c;color:#111;border:0;border-radius:28px;padding:14px 22px;font:600 15px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
#jl-fab:hover{background:#f4b52a}
#jl-modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.6);padding:16px}
#jl-modal.open{display:flex}
#jl-box{background:#fff;color:#111;width:100%;max-width:420px;border-radius:16px;padding:26px 22px 20px;position:relative;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#jl-box h3{margin:0 0 6px;font-size:21px;line-height:1.25;color:#111}
#jl-box p.jl-sub{margin:0 0 16px;color:#555;font-size:14px}
#jl-box label{display:block;font-size:13px;color:#444;margin:10px 0 4px}
#jl-box input,#jl-box select,#jl-box textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;padding:11px 12px;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#111}
#jl-box textarea{min-height:70px;resize:vertical}
#jl-box input:focus,#jl-box select:focus,#jl-box textarea:focus{outline:2px solid #e8a20c;border-color:#e8a20c}
#jl-send{margin-top:16px;width:100%;background:#111;color:#fff;border:0;border-radius:10px;padding:13px;font:600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer}
#jl-send:disabled{opacity:.6;cursor:wait}
#jl-tg{display:block;text-align:center;margin-top:12px;color:#0a6fb3;font-size:14px;text-decoration:none}
#jl-close{position:absolute;top:10px;right:12px;background:none;border:0;font-size:26px;line-height:1;color:#777;cursor:pointer}
#jl-msg{margin-top:12px;font-size:14px}
#jl-msg.ok{color:#14753a}#jl-msg.err{color:#b3261e}
.jl-hp{position:absolute!important;left:-9999px!important;height:0;overflow:hidden}
@media (max-width:600px){#jl-fab{right:14px;bottom:76px;padding:12px 18px;font-size:14px}}
</style>
<button id="jl-fab" type="button"></button>
<div id="jl-modal" role="dialog" aria-modal="true" aria-labelledby="jl-title">
  <form id="jl-box" novalidate>
    <button id="jl-close" type="button" aria-label="Закрыть">&times;</button>
    <h3 id="jl-title"></h3>
    <p class="jl-sub" id="jl-subtitle"></p>
    <label for="jl-name" id="jl-l-name"></label>
    <input id="jl-name" name="name" autocomplete="name" required>
    <label for="jl-phone" id="jl-l-phone"></label>
    <input id="jl-phone" name="phone" type="tel" autocomplete="tel" required placeholder="+998 __ ___ __ __">
    <label for="jl-service" id="jl-l-service"></label>
    <select id="jl-service" name="service"></select>
    <label for="jl-text" id="jl-l-text"></label>
    <textarea id="jl-text" name="text"></textarea>
    <div class="jl-hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
    <button id="jl-send" type="submit"></button>
    <div id="jl-msg" role="status"></div>
    <a id="jl-tg" href="https://t.me/juba_info" target="_blank" rel="noopener"></a>
  </form>
</div>
<script>
(function(){
  var uz = /^\/uz(\/|$)/.test(location.pathname);
  var T = uz ? {
    fab:'Ariza qoldirish', title:'Loyihangizni muhokama qilamiz', sub:'Raqamingizni qoldiring — menejer ish vaqtida qisqa vaqt ichida bog‘lanadi.',
    name:'Ismingiz', phone:'Telefon yoki Telegram', service:'Qaysi xizmat kerak', text:'Qisqacha vazifa (ixtiyoriy)',
    send:'Ariza yuborish', sending:'Yuborilmoqda…', ok:'Rahmat! Ariza qabul qilindi, tez orada bog‘lanamiz.',
    err:'Yuborib bo‘lmadi. Telegram orqali yozing: @juba_info', req:'Ism va telefonni kiriting.', tg:'Yoki Telegramda yozing: @juba_info',
    services:['SMM — ijtimoiy tarmoqlarda targ‘ibot','Target reklama','Kontekst reklama (Google, Yandex)','Brending va firma uslubi','Foto va video prodakshn','Sayt yoki bot yaratish','amoCRM joriy qilish','Boshqa']
  } : {
    fab:'Оставить заявку', title:'Обсудим ваш проект', sub:'Оставьте номер — менеджер свяжется с вами в рабочее время.',
    name:'Ваше имя', phone:'Телефон или Telegram', service:'Какая услуга нужна', text:'Коротко о задаче (необязательно)',
    send:'Отправить заявку', sending:'Отправляем…', ok:'Спасибо! Заявка принята, скоро свяжемся.',
    err:'Не удалось отправить. Напишите нам в Telegram: @juba_info', req:'Укажите имя и телефон.', tg:'Или напишите в Telegram: @juba_info',
    services:['SMM-продвижение','Таргетированная реклама','Контекстная реклама (Google, Yandex)','Брендинг и фирменный стиль','Фото и видео продакшн','Разработка сайта или бота','Внедрение amoCRM','Другое']
  };
  function $(id){return document.getElementById(id)}
  $('jl-fab').textContent=T.fab; $('jl-title').textContent=T.title; $('jl-subtitle').textContent=T.sub;
  $('jl-l-name').textContent=T.name; $('jl-l-phone').textContent=T.phone; $('jl-l-service').textContent=T.service;
  $('jl-l-text').textContent=T.text; $('jl-send').textContent=T.send; $('jl-tg').textContent=T.tg;
  var sel=$('jl-service'); T.services.forEach(function(s){var o=document.createElement('option');o.textContent=s;sel.appendChild(o)});
  var modal=$('jl-modal'), form=$('jl-box'), msg=$('jl-msg');
  function open(service){
    if(service){for(var i=0;i<sel.options.length;i++){if(service.toLowerCase().indexOf(sel.options[i].text.split(/[ (—]/)[0].toLowerCase())>-1){sel.selectedIndex=i;break}}}
    msg.textContent='';msg.className='';modal.classList.add('open');setTimeout(function(){$('jl-name').focus()},50)
  }
  function close(){modal.classList.remove('open')}
  $('jl-fab').addEventListener('click',function(){open()});
  $('jl-close').addEventListener('click',close);
  modal.addEventListener('click',function(e){if(e.target===modal)close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  // Кнопки «Заказать услугу» / «Buyurtma berish» открывают форму с выбранной услугой
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a.elementor-button');
    if(!a) return;
    var t=(a.textContent||'').trim().toLowerCase();
    if(t.indexOf('заказать')<0 && t.indexOf('buyurtma')<0) return;
    e.preventDefault();
    var sec=a.closest('.elementor-section, .elementor-column'), h=null;
    while(sec && !h){h=sec.querySelector('h1,h2,h3,h4'); sec=sec.parentElement&&sec.parentElement.closest('.elementor-section, .elementor-column')}
    open(h?h.textContent:'');
  },true);
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('jl-name').value.trim(), phone=$('jl-phone').value.trim();
    if(!name||!phone){msg.textContent=T.req;msg.className='err';return}
    var btn=$('jl-send'); btn.disabled=true; btn.textContent=T.sending;
    var body={name:name,phone:phone,website:form.website.value,
      message:'Услуга: '+sel.value+($('jl-text').value.trim()?'\n'+$('jl-text').value.trim():'')+'\nСтраница: '+location.pathname};
    fetch('https://jubatravel.uz/lead.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok||!j.ok)throw 0})})
      .then(function(){msg.textContent=T.ok;msg.className='ok';form.reset();setTimeout(close,3500)})
      .catch(function(){msg.textContent=T.err;msg.className='err'})
      .then(function(){btn.disabled=false;btn.textContent=T.send});
  });
})();
</script>
